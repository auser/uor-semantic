[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = [
    "crates/uor-semantic",
    "crates/model",
    "crates/conformance",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UOR-Foundation/uor-semantic"
homepage = "https://github.com/UOR-Foundation/uor-semantic"
authors = ["UOR Foundation"]
keywords = ["semantic-routing", "hyperdimensional", "no-std", "content-addressing"]
categories = ["algorithms", "data-structures", "no-std", "science"]

[workspace.dependencies]
uor-semantic = { version = "0.1.0", path = "crates/uor-semantic", default-features = false }
repo-model = { version = "0.1.0", path = "crates/model" }
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
uor-semantic-compiler = { version = "0.1.0", path = "crates/uor-semantic-compiler" }
uor-semantic-cli = { version = "0.1.0", path = "crates/uor-semantic-cli" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
